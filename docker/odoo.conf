[options]
; Odoo configuration used by the docker-compose setup (mounted read-only
; into the container at /etc/odoo/odoo.conf).

; Connection to the "db" service defined in docker-compose.yaml.
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Restrict which databases can be listed/managed from the web UI.
; Leave as-is or set to a specific database name once one is created.
dbfilter = .*

addons_path = /opt/odoo/addons,/mnt/extra-addons

; Where filestore/sessions are stored inside the container (see the
; "odoo-data" volume in docker-compose.yaml).
data_dir = /var/lib/odoo

; Set a real password before exposing this outside of local development.
admin_passwd = admin

proxy_mode = True
